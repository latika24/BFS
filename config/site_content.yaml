# -----------------------------------------------------------------------------
# TRUST AND COMPLIANCE REGISTER (§2.1, §1.3)
# -----------------------------------------------------------------------------
compliance:
  - item: "IRDAI registration"
    item_hi: "IRDAI पंजीकरण"
    status: "In progress"
    detail: >
      Three-stage registration — Forms R1, R2 and R3 — under the Insurance Act,
      1938. ₹100 crore of paid-up equity under Section 6 and a 150% solvency
      ratio under Section 64VA. We write on our own paper, not a partner's.
  - item: "Solvency"
    item_hi: "सॉल्वेंसी"
    status: "Targeted at 200%"
    detail: >
      Statutory minimum is 150%. We run an internal throttle at 180%: if the
      ratio touches it, we slow new business rather than write beyond capital.
  - item: "Your data, under the DPDP Act 2023"
    item_hi: "आपका डेटा, DPDP क़ानून 2023 के तहत"
    status: "You control it"
    detail: >
      Location data makes us a data fiduciary. Withdraw telematics consent at
      any time and your cover does not lapse — you move to a flat book rate.
      We never sell an individual risk score to any platform, ever.
  - item: "Grievance and ombudsman"
    item_hi: "शिकायत और लोकपाल"
    status: "Published monthly"
    detail: >
      Every complaint, its age and its outcome is published with the claims
      report. Escalation to the Insurance Ombudsman is free and we tell you how.
  - item: "Rural and social sector obligation"
    item_hi: "ग्रामीण और सामाजिक क्षेत्र दायित्व"
    status: "Met by design"
    detail: >
      Every insurer must write a minimum share of business from the unorganised
      sector. Our entire book qualifies naturally rather than by purchase.

# -----------------------------------------------------------------------------
# THE FOUR FAILURES WE EXIST TO FIX (§1.1) — the spine of the Why page
# -----------------------------------------------------------------------------
failures:
  - title: "It belongs to the app, not to you"
    title_hi: "कवर ऐप का है, आपका नहीं"
    body: >
      Platform cover is live only while you are logged in to that platform.
      About 40% of a rider's day is spent moving between apps, and that time
      falls into the gap between two policies.
    body_hi: >
      प्लेटफ़ॉर्म का कवर तभी चालू रहता है जब आप उसी ऐप पर लॉग-इन हों। राइडर का
      लगभग 40% दिन ऐप बदलने में जाता है, और वह समय दो पॉलिसियों के बीच की खाई
      में गिर जाता है।
    fix: "Your policy is yours. It stays live across every app, and it comes with you when you stop riding for one of them."
    fix_hi: "आपकी पॉलिसी आपकी है। हर ऐप पर चालू रहती है, और ऐप छोड़ने पर भी आपके साथ रहती है।"
  - title: "Your bike cover is quietly void"
    title_hi: "आपकी गाड़ी का बीमा चुपचाप रद्द है"
    body: >
      Most riders use a privately registered two-wheeler for commercial
      delivery, and every private motor policy in India excludes commercial
      use. The policy you pay for each year will not pay when you crash at work.
    body_hi: >
      ज़्यादातर राइडर प्राइवेट रजिस्टर्ड दोपहिया से कमर्शियल डिलीवरी करते हैं,
      और भारत की हर प्राइवेट मोटर पॉलिसी कमर्शियल इस्तेमाल को बाहर रखती है।
      जिस पॉलिसी का सालाना पैसा आप देते हैं, वह काम के दौरान हुए एक्सीडेंट पर
      पैसा नहीं देगी।
    fix: "Ride Shield covers on-duty damage to your two-wheeler, on a scheduled benefit paid straight to a network garage."
    fix_hi: "Ride Shield शिफ़्ट के दौरान गाड़ी के नुक़सान को कवर करता है, पैसा सीधे नेटवर्क गैरेज को।"
  - title: "It pays too slowly to matter"
    title_hi: "पैसा इतनी देर से आता है कि मतलब नहीं रहता"
    body: >
      Worker unions in Telangana and Karnataka have documented injured delivery
      partners waiting months for platform insurance to settle. A claim paid in
      four months is not a claim paid.
    body_hi: >
      तेलंगाना और कर्नाटक की यूनियनों ने दर्ज किया है कि घायल डिलीवरी पार्टनर
      महीनों तक प्लेटफ़ॉर्म बीमे के भुगतान का इंतज़ार करते हैं। चार महीने बाद
      मिला पैसा, पैसा नहीं है।
    fix: "Straightforward claims settle within a day, most of them within minutes, straight to your UPI."
    fix_hi: "सीधे क्लेम एक दिन में, ज़्यादातर कुछ मिनटों में, सीधे आपके UPI में।"
  - title: "It covers the accident, not the lost income"
    title_hi: "एक्सीडेंट कवर है, गई हुई कमाई नहीं"
    body: >
      A hospital bill is the loss that is easiest to underwrite. The loss that
      actually happens to a rider is the six weeks off the bike afterwards,
      with nothing coming in.
    body_hi: >
      अस्पताल का बिल बीमा कंपनी के लिए सबसे आसान नुक़सान है। राइडर के साथ जो
      असल में होता है वह उसके बाद के छह हफ़्ते हैं — गाड़ी बंद, कमाई शून्य।
    fix: "The daily income benefit pays 75% of your observed daily earnings for up to 90 days a year."
    fix_hi: "डेली इनकम बेनिफ़िट आपकी देखी गई रोज़ की कमाई का 75% देता है, साल में 90 दिन तक।"

# -----------------------------------------------------------------------------
# FAQs
# -----------------------------------------------------------------------------
faqs:
  - q: "Do I have to ride for a particular app?"
    q_hi: "क्या किसी ख़ास ऐप पर चलाना ज़रूरी है?"
    a: >
      No. The policy is issued to you, not to a platform. Ride for one app,
      four apps, or none this week — the cover follows you, and you are charged
      only for the hours you actually ride.
    a_hi: >
      नहीं। पॉलिसी आपके नाम पर है, किसी प्लेटफ़ॉर्म के नाम पर नहीं। एक ऐप,
      चार ऐप, या इस हफ़्ते कोई नहीं — कवर आपके साथ चलता है, और पैसा सिर्फ़ उन
      घंटों का लगता है जो आपने चलाया।
  - q: "What happens on a day I do not ride?"
    q_hi: "जिस दिन मैं नहीं चलाऊँ, उस दिन क्या?"
    a: >
      You pay nothing. Premium is charged per active hour, debited each evening
      by UPI Autopay. A day off costs ₹0 and your policy does not lapse.
    a_hi: >
      कुछ नहीं देना। पैसा सिर्फ़ चलाए गए घंटों का लगता है, हर शाम UPI ऑटोपे से
      कटता है। छुट्टी वाले दिन ₹0, और पॉलिसी बंद नहीं होती।
  - q: "Do I have to let you track my location?"
    q_hi: "क्या लोकेशन ट्रैक करने देना ज़रूरी है?"
    a: >
      No. Sharing riding data usually makes your price lower, because safe
      riding earns a discount. If you withdraw consent, you move to a flat book
      rate and your cover stays live. We never sell your individual score to a
      platform.
    a_hi: >
      नहीं। राइडिंग डेटा शेयर करने से आमतौर पर आपका रेट कम होता है, क्योंकि
      सुरक्षित चलाने पर छूट मिलती है। सहमति वापस लेने पर आप फ़्लैट रेट पर आ
      जाते हैं और कवर चालू रहता है। आपका स्कोर हम किसी प्लेटफ़ॉर्म को कभी
      नहीं बेचते।
  - q: "I already have cover from the platform I ride for. Why do I need this?"
    q_hi: "जिस प्लेटफ़ॉर्म पर चलाता हूँ उसका कवर पहले से है। फिर यह क्यों?"
    a: >
      Platform cover switches off when you log out, does not replace your
      income, and stops entirely the day you stop riding for that platform. It
      is worth having. It is not enough on its own.
    a_hi: >
      प्लेटफ़ॉर्म का कवर लॉग-आउट करते ही बंद हो जाता है, आपकी कमाई की भरपाई
      नहीं करता, और उस ऐप को छोड़ते ही पूरी तरह ख़त्म। वह रखने लायक़ है।
      अकेले काफ़ी नहीं है।
  - q: "Is there a lock-in or a joining fee?"
    q_hi: "क्या कोई लॉक-इन या जॉइनिंग फ़ीस है?"
    a: >
      Neither. No joining fee, no minimum term, cancel from the app in two
      taps. If we are not worth ₹2.50 an hour to you, we would rather you left.
    a_hi: >
      कुछ नहीं। कोई जॉइनिंग फ़ीस नहीं, कोई मियाद नहीं, ऐप से दो टैप में बंद।
      अगर हम आपके लिए ₹2.50 प्रति घंटे लायक़ नहीं हैं, तो आपका जाना ही ठीक है।
  - q: "What if my claim is rejected?"
    q_hi: "अगर मेरा क्लेम रिजेक्ट हो जाए तो?"
    a: >
      You get the reason in writing, in your language, with the evidence we
      used. You can appeal free of charge, and escalate to the Insurance
      Ombudsman, which is also free. We publish our rejection reasons monthly.
    a_hi: >
      कारण आपको लिखित में, आपकी भाषा में, उस सबूत के साथ मिलेगा जो हमने देखा।
      अपील मुफ़्त है, और बीमा लोकपाल तक जाना भी मुफ़्त। हम हर महीने अपने
      रिजेक्शन के कारण छापते हैं।
