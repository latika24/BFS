# -----------------------------------------------------------------------------
# SETTLEMENT PROMISE — what we commit to publicly
# -----------------------------------------------------------------------------
settlement_promise:
  instant_heads_minutes: 3
  standard_head_hours: 24
  investigation_head_days: 7
  advance_on_death_claim_hours: 48
  advance_on_death_claim_amount: 100000
  late_payment_penalty_note: >
    If we miss our own 24-hour promise on a straightforward claim, we credit
    ₹500 to your UPI. It is our deadline, so it is our cost when we miss it.
  late_payment_penalty_note_hi: >
    अगर सीधे-सादे क्लेम पर हम अपना 24 घंटे का वादा तोड़ते हैं, तो ₹500 आपके UPI
    में जमा होंगे। समय-सीमा हमारी है, इसलिए चूक की क़ीमत भी हमारी।

# -----------------------------------------------------------------------------
# RIDER TESTIMONIALS
# Composite riders drawn from the segments in §3.1, not real individuals.
# -----------------------------------------------------------------------------
testimonials:
  - name: "Ramesh K."
    role: "Food delivery + quick commerce · Bengaluru · 3 years riding"
    role_hi: "फ़ूड डिलीवरी + क्विक कॉमर्स · बेंगलुरु · 3 साल से"
    quote: >
      I ride for two apps. The old cover only worked on one of them, and the
      switch between apps was exactly when I was in traffic. Now it does not
      matter which app the order came from.
    quote_hi: >
      मैं दो ऐप पर चलाता हूँ। पुराना कवर सिर्फ़ एक पर काम करता था, और ऐप बदलने
      का वही समय होता था जब मैं ट्रैफ़िक में था। अब फ़र्क़ नहीं पड़ता कि ऑर्डर
      किस ऐप का है।
  - name: "Sunita D."
    role: "Parcel delivery · Pune · rides four days a week"
    role_hi: "पार्सल डिलीवरी · पुणे · हफ़्ते में चार दिन"
    quote: >
      An annual policy wanted the same money from me as from someone riding
      every day. I ride four days. Paying by the hour was the first time the
      price made sense for the work I actually do.
    quote_hi: >
      सालाना पॉलिसी मुझसे उतने ही पैसे माँगती थी जितने रोज़ चलाने वाले से। मैं
      चार दिन चलाती हूँ। घंटे के हिसाब से पैसा देना पहली बार सही लगा।
  - name: "Imran S."
    role: "Quick commerce · Delhi NCR · claimed in March"
    role_hi: "क्विक कॉमर्स · दिल्ली NCR · मार्च में क्लेम किया"
    quote: >
      Broken wrist, six weeks off the bike. The money came every week while I
      was not earning. That is the part nobody else was covering.
    quote_hi: >
      कलाई टूटी, छह हफ़्ते गाड़ी बंद। जब कमाई नहीं हो रही थी तब हर हफ़्ते पैसा
      आता रहा। यही चीज़ और कोई नहीं दे रहा था।
  - name: "Mahesh P."
    role: "Bike taxi · Hyderabad · joined through his depot"
    role_hi: "बाइक टैक्सी · हैदराबाद · डिपो से जुड़े"
    quote: >
      My private bike policy would not have paid for a commercial trip. I only
      found that out when I read this site. Twelve years riding and nobody had
      told me.
    quote_hi: >
      मेरी प्राइवेट बाइक पॉलिसी कमर्शियल राइड पर पैसा नहीं देती। यह मुझे इसी
      साइट पर पता चला। बारह साल से चला रहा हूँ, किसी ने नहीं बताया।

