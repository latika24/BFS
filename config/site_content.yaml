# =============================================================================
# Commercial content for GigSure.com
#
# rating_factors.yaml holds every number the RISK model uses. This file holds
# every number and claim the WEBSITE makes: the published claims report, rider
# testimonials, referral terms, distribution partners and the compliance
# register. Same principle — nothing hard-coded in a page.
#
# The claims report is the primary trust instrument in the plan (§3.3,
# "monthly published claims data ... as the primary trust instrument"). The
# figures below are the modelled steady-state book, not live experience, and
# the site says so on the Trust page.
# =============================================================================

